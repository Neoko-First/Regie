packages:
  - "apps/*"
  - "packages/*"

# Dépendances autorisées à exécuter des scripts d'installation (binaires natifs)
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - prisma
  - "@prisma/engines"
  - "@parcel/watcher"

# Scripts volontairement bloqués (télémétrie)
ignoredBuiltDependencies:
  - "@scarf/scarf"
