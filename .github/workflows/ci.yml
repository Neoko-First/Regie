name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest

    # Base éphémère pour les tests e2e de l'API
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Valeurs de CI uniquement (base jetable, aucun secret réel)
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      WEB_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Migrations et tests e2e de l'API
        run: |
          pnpm --filter @regie/api db:deploy
          pnpm --filter @regie/api test:e2e
